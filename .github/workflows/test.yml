name: test

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  verify:
    name: verify (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['18.x', '20.x']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test

  assets:
    name: generated assets are current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
      - run: node tools/region-map.js
      - run: node tools/og-card.js
      - name: assets/ must be byte-identical to what is committed
        run: git diff --exit-code -- assets/
